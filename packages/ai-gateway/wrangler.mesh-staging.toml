name = "ai-proxy-mesh-staging-d48e"
main = "src/index.ts"
compatibility_date = "2024-10-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
VERTEX_REGION = "us-east5"
MODEL_GATING_ENABLED = "true"
PIPE_FRONTIER_POLICY = "reject"

[[d1_databases]]
binding = "DB"
database_name = "screenpipe-mesh-staging-d48e"
database_id = "b3a864cc-b073-4662-a625-b63fd8f5abe3"

[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" }
]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]
