name: PR evidence check

# screenpipe — AI that knows everything you've seen, said, or heard
# https://screenpipe.com
# checks that contributors select an evidence category and that UI or behavior
# changes include a before/after recording. uses pull_request_target so it can
# label/comment on fork PRs (it only reads PR metadata via the api — it never
# checks out untrusted PR code).

on:
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-evidence-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR evidence requirements
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;

            const LABEL = "needs-evidence";
            const MARKER = "<!-- pr-evidence-check -->";
            const LEGACY_LABEL = "potential-ai-slop";
            const LEGACY_MARKER = "<!-- potential-ai-slop-check -->";

            // ---- detect a video in the PR description -------------------------
            // strip image markdown first, so github drag-dropped IMAGES
            //   ![alt](https://github.com/user-attachments/assets/<uuid>)
            // don't count. videos are inserted by github as a BARE url on their
            // own line, so a bare user-attachments link == video.
            const body = pr.body || "";
            const withoutImages = body.replace(/!\[[^\]]*\]\([^)]*\)/g, "");

            const videoPatterns = [
              /<video[\s>]/i,                                                                 // html5 embed
              /\.(mp4|mov|webm|m4v|avi|mkv|ogv|mpe?g|gif)(\?[^\s)"'<>]*)?/i,                   // video / recording file links
              /https?:\/\/(www\.)?(youtube\.com|youtu\.be|loom\.com|vimeo\.com|streamable\.com|vidyard\.com|wistia\.com|tella\.tv|screen\.studio)\b/i, // video hosts
              /https?:\/\/github\.com\/user-attachments\/assets\/[0-9a-f-]+/i,                // github drag-drop (video; images stripped above)
              /https?:\/\/user-images\.githubusercontent\.com\/\S+\.(mp4|mov|webm|m4v|gif)/i, // legacy attachment host
            ];

            const hasVideo = videoPatterns.some((re) => re.test(withoutImages));
            const evidenceKinds = {
              ui: /-\s*\[[xX]\]\s*UI or behavior change\b/i,
              backend: /-\s*\[[xX]\]\s*Backend change\b/i,
              performance: /-\s*\[[xX]\]\s*Performance change\b/i,
              nonRuntime: /-\s*\[[xX]\]\s*Docs, CI, or pure refactor\b/i,
            };
            const selectedKinds = Object.entries(evidenceKinds)
              .filter(([, pattern]) => pattern.test(body))
              .map(([kind]) => kind);
            const needsCategory = selectedKinds.length === 0;
            const needsUiRecording = selectedKinds.includes("ui") && !hasVideo;
            const needsEvidence = needsCategory || needsUiRecording;
            core.info(
              `PR #${issue_number} selectedKinds=${selectedKinds.join(",")} hasVideo=${hasVideo}`,
            );

            // ---- helpers ------------------------------------------------------
            async function ensureLabel() {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: LABEL });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: LABEL,
                  color: "FBCA04",
                  description: "Exact results, logs, benchmarks, or end-to-end evidence are required",
                });
              }
            }

            async function findMarkerComments() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              return comments.filter(
                (c) =>
                  c.body &&
                  (c.body.includes(MARKER) || c.body.includes(LEGACY_MARKER)),
              );
            }

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name,
                });
                core.info(`Removed ${name} from PR #${issue_number}`);
              } catch (e) {
                if (e.status !== 404) throw e; // 404 == label wasn't set, fine
              }
            }

            // ---- act ----------------------------------------------------------
            const existingComments = await findMarkerComments();
            const existing = existingComments[0];

            // Any PR touched by the new check leaves the retired state behind.
            await removeLabel(LEGACY_LABEL);

            if (needsEvidence) {
              await ensureLabel();
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [LABEL],
              });

              const commentBody = [
                MARKER,
                "👋 thanks for the pr!",
                "",
                "this PR is in the **`" + LABEL + "`** process state. this is a concrete evidence request, not a judgment about how the PR was written.",
                "",
                "to resolve it:",
                needsCategory
                  ? "- select every applicable evidence category in the PR template and provide the requested evidence"
                  : "- add a short **before/after screen recording** for the selected UI or behavior change",
                needsUiRecording
                  ? "- drag the recording into the PR description — GitHub hosts it (never commit media into the repo)"
                  : "",
                "- edit the PR description after fixing this; the check will run again and remove the process state",
                "",
                "docs, CI, pure refactors, backend work, and performance work are not required to fabricate a video; select their category and provide the appropriate checks, tests/logs, or benchmarks instead.",
                "",
                "a maintainer may close the PR while waiting. you are welcome to reopen it after addressing the request. see the [AI-assisted contribution policy](https://github.com/screenpipe/screenpipe/blob/main/CONTRIBUTING.md#ai-assisted-contributions).",
              ].join("\n");

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: commentBody,
                });
              }
              core.info(`Marked PR #${issue_number} as ${LABEL}`);

              for (const duplicate of existingComments.slice(1)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: duplicate.id,
                });
              }
            } else {
              // The selected evidence category passes the structural check.
              await removeLabel(LABEL);

              for (const comment of existingComments) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
              core.info(`Deleted resolved evidence comments on PR #${issue_number}`);
            }
