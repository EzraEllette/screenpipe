name: Windows Azure VM Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: windows-azure-vm-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: azure-windows-vm
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_WINDOWS_VM_RESOURCE_GROUP: ${{ vars.AZURE_WINDOWS_VM_RESOURCE_GROUP }}
      AZURE_WINDOWS_VM_LOCATION: ${{ vars.AZURE_WINDOWS_VM_LOCATION }}
      AZURE_WINDOWS_WORKER_IDENTITY_ID: ${{ vars.AZURE_WINDOWS_WORKER_IDENTITY_ID }}
      AZURE_WINDOWS_RDP_VAULT: ${{ vars.AZURE_WINDOWS_RDP_VAULT }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create disposable Windows 11 VM
        id: create
        shell: bash
        run: |
          set -euo pipefail
          run_id="gh-${GITHUB_RUN_ID}"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          RDP_SOURCE_CIDR="$(curl --fail --silent --show-error https://api.ipify.org)/32" \
            ./scripts/windows-vm/create.sh "$run_id"

      - name: Verify guest provisioning
        shell: bash
        run: ./scripts/windows-vm/run-command.sh "${{ steps.create.outputs.run-id }}" ./scripts/windows-vm/smoke.ps1

      - name: Tear down exact VM run
        if: always() && steps.create.outputs.run-id != ''
        shell: bash
        run: ./scripts/windows-vm/teardown.sh "${{ steps.create.outputs.run-id }}"
